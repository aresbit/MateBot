<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autoresearch Dashboard - linux-kernel-modernization</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
    h1 { margin: 0 0 8px 0; }
    .muted { color: #6b7280; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #f1f5f9; padding: 8px; text-align: left; font-size: 14px; }
    .baseline { color: #2563eb; font-weight: 600; }
    .keep { color: #16a34a; font-weight: 600; }
    .discard { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Autoresearch: linux-kernel-modernization</h1>
  <div class="muted" id="status">Loading...</div>

  <div class="grid">
    <div class="card">
      <canvas id="scoreChart" height="220"></canvas>
    </div>
    <div class="card">
      <h3>Eval Breakdown</h3>
      <table>
        <thead><tr><th>Eval</th><th>Pass</th></tr></thead>
        <tbody id="breakdown"></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top: 16px;">
    <h3>Experiments</h3>
    <table>
      <thead><tr><th>ID</th><th>Score</th><th>Pass rate</th><th>Status</th><th>Description</th></tr></thead>
      <tbody id="expRows"></tbody>
    </table>
  </div>

  <script>
    async function render() {
      const res = await fetch('./results.json', { cache: 'no-store' });
      const data = await res.json();

      document.getElementById('status').textContent =
        `Status: ${data.status} | Baseline: ${data.baseline_score}% | Best: ${data.best_score}%`;

      const tbody = document.getElementById('expRows');
      tbody.innerHTML = data.experiments.map(e => `
        <tr>
          <td>${e.id}</td>
          <td>${e.score}/${e.max_score}</td>
          <td>${e.pass_rate}%</td>
          <td class="${e.status}">${e.status}</td>
          <td>${e.description}</td>
        </tr>
      `).join('');

      const b = document.getElementById('breakdown');
      b.innerHTML = data.eval_breakdown.map(x => `
        <tr><td>${x.name}</td><td>${x.pass_count}/${x.total}</td></tr>
      `).join('');

      const ctx = document.getElementById('scoreChart');
      const labels = data.experiments.map(e => `Exp ${e.id}`);
      const values = data.experiments.map(e => e.pass_rate);
      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Pass Rate (%)',
            data: values,
            borderColor: '#2563eb',
            backgroundColor: '#bfdbfe',
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          scales: { y: { min: 0, max: 100 } }
        }
      });
    }

    render();
    setInterval(render, 10000);
  </script>
</body>
</html>
